name: Accessibility

# Auditoría automática de accesibilidad (pa11y-ci + axe-core por debajo) en
# cada push/PR a main. Único sitio de la familia El Tano Design con repo en
# GitHub — el resto se despliega manual (Netlify Drop), sin CI a donde engancharlo.
# Ver oss-audit-eltanodesign-sites.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  a11y:
    name: pa11y-ci (WCAG2AA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Servir el build
        run: npx --yes serve -s dist -l 4173 &
      - name: Esperar al servidor
        run: npx --yes wait-on http://localhost:4173
      - name: Auditar accesibilidad
        # Usa el Chrome que ya trae el runner de GitHub en vez de depender de la
        # descarga de puppeteer, que fallo el 05-oct-2026 ("Could not find
        # Chrome") y dejo el check en rojo sin que cambiara nada del sitio.
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          export PUPPETEER_EXECUTABLE_PATH="$(command -v google-chrome || command -v google-chrome-stable)"
          echo "Chrome: $PUPPETEER_EXECUTABLE_PATH"
          npx --yes pa11y-ci --config .pa11yci.json
